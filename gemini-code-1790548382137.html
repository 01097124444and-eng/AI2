<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهمي إي آي - Fahmy AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        header h1 { font-size: 1.2rem; color: #fff; }
        .menu-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user-message { background-color: #2b5278; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #1e1e1e; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .error-message { background-color: #5c2b2b; color: #ff8080; align-self: center; }
        .input-container { padding: 15px 20px; background-color: #1f1f1f; display: flex; gap: 10px; border-top: 1px solid #333; }
        input[type="text"] { flex: 1; padding: 12px 15px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; outline: none; font-size: 1rem; }
        input[type="text"]:focus { border-color: #0084ff; }
        button.send-btn { padding: 0 20px; background-color: #0084ff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button.send-btn:hover { background-color: #006dd6; }
        /* Sidebar */
        .sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background-color: #181818; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 1000; transition: right 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-left: 1px solid #333; }
        .sidebar.open { right: 0; }
        .sidebar h3 { color: #fff; font-size: 1.1rem; margin-bottom: 5px; }
        .sidebar input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; }
        .sidebar button { padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .sidebar button:hover { background-color: #218838; }
        .close-sidebar { background: none; border: none; color: #aaa; font-size: 1.2rem; align-self: flex-start; cursor: pointer; margin-bottom: 10px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .overlay.show { display: block; }
    </style>
</head>
<body>

    <header>
        <h1>فهمي إي آي (Fahmy AI)</h1>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً يا أسطى! أنا فهمي معاك أونلاين، حط مفتاح الـ API من القاموس أو القايمة (☰) وتعال دردش معايا في أي كود أو مشكلة!</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا يا بطل..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <!-- Sidebar -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">✕ إغلاق</button>
        <h3>إعدادات المفتاح (API Key)</h3>
        <p style="font-size: 0.85rem; color: #aaa;">حط مفتاح Gemini API بتاعك هنا وهيتحفظ تلقائي عندك:</p>
        <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح الـ API هنا...">
        <button onclick="saveApiKey()">حفظ المفتاح</button>
    </div>

    <script>
        const systemInstruction = "أنت مساعد ذكاء اصطناعي مصري ودود واسمك 'فهمي'. تتحدث باللهجة المصرية الجدعة والكوميدية والمهنية في نفس الوقت، وتساعد المستخدم (محمد) في البرمجة والمشاكل التقنية بكل بساطة.";

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('يا مسهل، اتفظ المفتاح بنجاح يا بطل!');
                toggleSidebar();
            } else {
                alert('من فضلك دخل مفتاح صحيح الأول.');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                appendMessage('يا أسطى انسيت تحط مفتاح الـ API! افتح القايمة (☰) من فوق وحط المفتاح الأول[cite: 3].', 'error-message');
                return;
            }

            appendMessage(text, 'user-message');
            inputField.value = '';

            const loadingId = appendMessage('فهمي بيشرب الشاي وبيفكر...', 'ai-message');

            try {
                // استخدام أحدث موديل وتحديثات جوجل الرسمية
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemInstruction + "\n\nالمستخدم بيقول: " + text }] }
                        ]
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'ai-message');
                } else if (data.error) {
                    appendMessage('مشكلة يا باشا: ' + data.error.message, 'error-message');
                } else {
                    appendMessage('حصلت حاجة غريبة، جرب تاني يا أسطى.', 'error-message');
                }

            } catch (error) {
                removeMessage(loadingId);
                appendMessage('خطأ في الاتصال بالشبكة، تأكد من الإنترنت والمفتاح.', 'error-message');
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function removeMessage(element) {
            if (element) element.remove();
        }
    </script>
</body>
</html>
